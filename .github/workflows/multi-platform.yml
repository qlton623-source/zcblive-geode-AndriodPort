name: Build ZCB Live (Android64)

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build-android64:
    name: Android64 (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          targets: aarch64-linux-android

      - name: Build Geode Mod (Android64)
        id: geode-build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: given
          bindings: geode-sdk/bindings
          bindings-ref: main
          android-min-sdk: 23

      - name: Upload Android64 .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: zcblive-android64
          path: ${{ steps.geode-build.outputs.build-output }}/*.geode
          if-no-files-found: error
