[package]
name = "zcblive"
version = "0.2.5"
edition = "2021"
build = "build.rs"

[lib]
crate-type = ["staticlib"] # `cdylib` for DLL, `staticlib` for Geode

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
#debug = true

[workspace]
members = [".", "egui_gl_hook", "gfmod"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.93"
egui = "0.27"
egui-keybind = { version = "0.3.0", features = ["serde"] }
egui-modal = "0.3.6"
egui_gl_hook = { path = "egui_gl_hook" }
log = "0.4.22"
once_cell = "1.20.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastrand = "2.2.0"
egui_clickpack_db = { git = "https://github.com/zeozeozeo/egui_clickpack_db.git", rev = "eb60943e3d7e0226729a01e4f53924196a31c2c6", features = ["live"] }
ureq = "2.10.1"
egui-notify = "0.14.0"
parking_lot = "0.12.2"
gfmod = { path = "gfmod" }
android_logger = "0.14"

[build-dependencies]
built = "0.7.5"

[features]
default = ["geode"]
geode = []
